version: "3.8" services: # PostgreSQL database postgres: image: postgres:16-alpine container_name: arches-postgres environment: POSTGRES_DB: arches POSTGRES_USER: arches POSTGRES_PASSWORD: arches_dev ports: - "5432:5432" volumes: - arches_pgdata:/var/lib/postgresql/data healthcheck: test: ["CMD-SHELL", "pg_isready -U arches"] interval: 5s timeout: 5s retries: 10 networks: - arches-net # Development build container (auto-detects platform) arches-dev: build: context: .. dockerfile: docker/Dockerfile.unified args: UID: ${UID:-1000} GID: ${GID:-1000} # Auto-detect platform: buildx will use the host architecture platforms: - linux/amd64 - linux/arm64 container_name: arches-dev depends_on: postgres: condition: service_healthy env_file: - ../.env environment: # Override DB connection to use Docker network JOSHUA_DB_HOST: postgres JOSHUA_DB_PORT: 5432 # Enable ccache CCACHE_DIR:/home/builder/.ccache volumes: # Mount source code - ..:/workspace:rw # Persistent ccache - arches_ccache:/home/builder/.ccache # Persistent build directory (speeds up rebuilds) - arches_build:/workspace/build working_dir:/workspace ports: - "50051:50051" # gRPC - "8080:8080" # HTTP/REST - "9100:9100" # Prometheus metrics networks: - arches-net # Keep container running for development command: tail -f/dev/null stdin_open: true tty: true networks: arches-net: driver: bridge volumes: arches_pgdata: arches_ccache: arches_build:
